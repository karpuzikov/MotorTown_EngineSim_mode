name: Native headless audio (Windows)

on:
  push:
    branches: [feat/native-engine-audio]
  pull_request:

jobs:
  engine-sim-pcm:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify local one-command Windows build helper parses and plans safely
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'native/ue4ss-parent/build-local.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'PowerShell parse failed' }
          & (Resolve-Path 'native/ue4ss-parent/build-local.ps1').Path -PlanOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native UE4SS parent CMake wiring (stand-in SDK only)
        shell: pwsh
        run: python -m unittest native.tests.test_ue4ss_build_parent -v

      - name: Verify native loader dependency audit
        shell: pwsh
        run: python -m unittest native.tests.test_native_load_diagnostics -v

      - name: Verify development installer scope, backup and PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'native/ue4ss-parent/install-dev-test.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'Dev installer PowerShell parse failed' }
          python -m unittest native.tests.test_dev_test_installer -v

      - name: Install original Engine Simulator build dependencies
        shell: pwsh
        run: |
          choco install winflexbison3 -y --no-progress
          & 'C:\vcpkg\vcpkg.exe' install 'sdl2:x64-windows' 'sdl2-image:x64-windows' 'boost-filesystem:x64-windows'

      - name: Configure headless PCM smoke (no UE4SS or GUI)
        shell: pwsh
        run: |
          cmake -S native -B native/build-windows -G 'Visual Studio 17 2022' -A x64 `
            -DMTES_HEADLESS_SMOKE=ON `
            -DCMAKE_TOOLCHAIN_FILE='C:/vcpkg/scripts/buildsystems/vcpkg.cmake'

      - name: Verify pinned synth packet limit and previous build patch upgrade
        shell: pwsh
        run: |
          $env:MTES_ENGINE_SIM_SOURCE = (Resolve-Path 'native/build-windows/_deps/mtes_engine_sim-src').Path
          python -m unittest native.tests.test_core_patch -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build genuine Engine Simulator PCM source
        shell: pwsh
        run: cmake --build native/build-windows --config Release --target mtes-headless-smoke --parallel 4

      - name: Run actual combustion audio smoke
        shell: pwsh
        run: |
          $assets = Join-Path (Resolve-Path 'native/build-windows/_deps/mtes_engine_sim-src').Path 'assets'
          $original = Get-Content -Raw (Join-Path $assets 'main.mr')
          $defaultEngine = 'engines/atg-video-2/01_subaru_ej25_eh.mr'
          if (-not $original.Contains($defaultEngine)) { throw 'Pinned engine test fixture changed' }
          $profiles = @((Join-Path $assets 'main.mr'))
          # Boxer 4, American V8, Japanese V10. Each wrapper uses the original
          # script/compiler/synth, with imports kept relative to the assets dir.
          foreach ($variant in @(
              @{ name = 'gm-ls-v8'; engine = 'engines/atg-video-2/07_gm_ls.mr' },
              @{ name = 'lfa-v10'; engine = 'engines/atg-video-2/10_lfa_v10.mr' }
            )) {
            $path = Join-Path $assets ("mtes-" + $variant.name + '.mr')
            [System.IO.File]::WriteAllText($path,
              $original.Replace($defaultEngine, $variant.engine),
              [System.Text.UTF8Encoding]::new($false))
            $profiles += $path
          }
          # Exercise the exact .mr wrapper shipped for the first in-game
          # Dory V8 trial; passing the generic GM LS fixture is insufficient.
          $dory = Join-Path $assets 'mtes-dory-prototype.mr'
          Copy-Item 'native/profiles/dory_v8_prototype.mr' $dory
          $profiles += $dory
          & 'native/build-windows/Release/mtes-headless-smoke.exe' @profiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Dory PCM with only assets shipped in the native mod
        shell: pwsh
        run: |
          $source = (Resolve-Path 'native/build-windows/_deps/mtes_engine_sim-src').Path
          $trial = Join-Path (Resolve-Path 'native/build-windows').Path 'packaged-v8-trial'
          $assets = Join-Path $trial 'assets'
          New-Item -ItemType Directory -Force -Path (Join-Path $assets 'engines/atg-video-2') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $assets 'sound-library/smooth') | Out-Null
          Copy-Item 'native/profiles/dory_v8_prototype.mr' (Join-Path $assets 'dory_v8_prototype.mr')
          Copy-Item (Join-Path $source 'assets/engines/atg-video-2/07_gm_ls.mr') (Join-Path $assets 'engines/atg-video-2/07_gm_ls.mr')
          Copy-Item (Join-Path $source 'assets/sound-library/smooth/smooth_39.wav') (Join-Path $assets 'sound-library/smooth/smooth_39.wav')
          Copy-Item (Join-Path $source 'es') (Join-Path $trial 'es') -Recurse
          & 'native/build-windows/Release/mtes-headless-smoke.exe' (Join-Path $assets 'dory_v8_prototype.mr')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
