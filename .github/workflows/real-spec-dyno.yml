name: Real-spec engine dyno (Windows)

# Generates every engine script from the real-car specs, runs each on the
# offline dynamometer and uploads measured power/torque plus WAV renders.
# A full run takes over an hour; start it by hand (gh workflow run).
on:
  workflow_dispatch:
    inputs:
      engines:
        description: 'Space-separated engine ids (empty = all)'
        required: false
        default: ''
      rpm_step:
        description: 'Dyno speed step, rpm'
        required: false
        default: '500'
      flame_speed_scale:
        description: 'Calibration only: flame-speed factor override (empty = generator default)'
        required: false
        default: ''
      rule_overrides:
        description: 'Calibration only: JSON of generator rule constants to replace'
        required: false
        default: ''
      publish_renders:
        description: 'Push WAV renders to branch dyno-renders-<shard> (yes/empty)'
        required: false
        default: ''
      find_mbt:
        description: 'Search the best spark advance (find-mbt) or use the script timing (empty)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  dyno:
    runs-on: windows-2022
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests for the script generator
        run: |
          python -m pip install numpy scipy
          python -m unittest discover -s pipeline/tests -v

      - name: Install Engine Simulator build dependencies
        shell: pwsh
        run: |
          # The Chocolatey feed times out now and then; fall back to the release zip.
          choco install winflexbison3 -y --no-progress
          if (-not (Get-Command win_flex -ErrorAction SilentlyContinue)) {
            $zip = Join-Path $env:RUNNER_TEMP 'winflexbison.zip'
            Invoke-WebRequest 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip' -OutFile $zip
            $dir = Join-Path $env:RUNNER_TEMP 'winflexbison'
            Expand-Archive $zip -DestinationPath $dir
            Add-Content $env:GITHUB_PATH $dir
          }
          & 'C:\vcpkg\vcpkg.exe' install 'sdl2:x64-windows' 'sdl2-image:x64-windows' 'boost-filesystem:x64-windows'

      - name: Build dynamometer
        shell: pwsh
        run: |
          cmake -S pipeline/render -B build-dyno -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE='C:/vcpkg/scripts/buildsystems/vcpkg.cmake'
          cmake --build build-dyno --config Release --target motor_town_engine_sim_dyno --parallel 4

      - name: Generate scripts and run the dynamometer
        shell: pwsh
        run: |
          $run = New-Item -ItemType Directory -Force -Path 'dyno-run'
          Copy-Item -Recurse 'build-dyno/_deps/motor_town_engine_sim_core-src/es' (Join-Path $run 'es')
          $engines = "${{ github.event.inputs.engines }}".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          $env:MOTOR_TOWN_ENGINE_SIM_FLAME_SPEED_SCALE = "${{ github.event.inputs.flame_speed_scale }}"
          if (-not $env:MOTOR_TOWN_ENGINE_SIM_FLAME_SPEED_SCALE) { Remove-Item Env:MOTOR_TOWN_ENGINE_SIM_FLAME_SPEED_SCALE }
          $env:MOTOR_TOWN_ENGINE_SIM_RULE_OVERRIDES = '${{ github.event.inputs.rule_overrides }}'
          python -I pipeline/generate_engine_scripts.py (Join-Path $run 'assets') @engines
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $step = "${{ github.event.inputs.rpm_step }}"
          if (-not $step) { $step = '500' }
          $mbt = "${{ github.event.inputs.find_mbt }}"
          $exe = (Resolve-Path 'build-dyno/Release/motor_town_engine_sim_dyno.exe').Path
          $env:MTES_SCRIPT_LOG_PATH = (Join-Path (Resolve-Path $run) 'error_log.log')
          Push-Location $run
          New-Item -ItemType Directory -Force -Path 'results' | Out-Null
          $failed = @()
          $scripts = @(Get-ChildItem 'assets/*.mr' | Sort-Object Name)
          for ($index = ${{ matrix.shard }}; $index -lt $scripts.Count; $index += 4) {
            $script = $scripts[$index]
            $out = Join-Path 'results' $script.BaseName
            & $exe $script.FullName $out $step $mbt *> "$out.log"
            if ($LASTEXITCODE -ne 0) {
              $failed += $script.BaseName
              if (Test-Path 'error_log.log') { Copy-Item 'error_log.log' "$out.compile.log" }
            }
          }
          Copy-Item 'assets/manifest.json' 'results/manifest.json'
          Pop-Location
          # Artifacts may be unreachable for whoever reads the run; print the essentials first.
          foreach ($dyno in Get-ChildItem 'dyno-run/results/*/dyno.json') { Get-Content $dyno }
          python -I pipeline/compare_dyno_to_rated.py dyno-run/results | Tee-Object dyno-run/results/summary.txt
          foreach ($log in Get-ChildItem 'dyno-run/results/*.log') { Write-Host "----- $($log.BaseName)"; Get-Content $log -Tail 25 }
          foreach ($name in $failed | Select-Object -First 3) {
            Write-Host "===== $name"
            Get-Content "dyno-run/results/$name.log" -Tail 40
            if (Test-Path "dyno-run/results/$name.compile.log") { Get-Content "dyno-run/results/$name.compile.log" -Tail 40 }
          }
          if ($failed.Count) { Write-Host "Failed: $($failed -join ' ')"; exit 1 }

      - name: Publish renders to a branch (artifacts are unreachable for some readers)
        if: github.event.inputs.publish_renders == 'yes'
        shell: pwsh
        run: |
          $branch = "dyno-renders-${{ matrix.shard }}"
          $publish = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'publish')
          Copy-Item -Recurse 'dyno-run/results/*' $publish
          Push-Location $publish
          git init -q -b $branch
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add -A
          git commit -q -m "Dyno renders from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:$branch"
          Pop-Location

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dyno-results-${{ matrix.shard }}
          path: dyno-run/results
